openapi: 3.1.1
info:
  title: LLM Wiki API
  version: 0.1.0
  description: 单个 Markdown 知识库的收录、查询、沉淀和检查接口草案。
paths:
  /v1/sources:
    post:
      operationId: ingestSource
      summary: 收录 Markdown 原文并更新知识库
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceInput' }
            example:
              title: 社区工作坊记录
              markdown: "周六的工作坊从 10 点开始。报名人数达到 12 人时分为两组。"
      responses:
        '201':
          description: 已保存原文并提交相关页面、索引和日志
          headers:
            Location:
              schema: { type: string, format: uri-reference }
              description: 原文的读取路径
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestResult' }
        '200':
          description: 相同资料已收录，返回首次收录结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestResult' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '422': { $ref: '#/components/responses/InvalidReference' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/sources/{sourceId}:
    parameters:
      - name: sourceId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/SourceId' }
    get:
      operationId: getSource
      summary: 读取已归档原文
      responses:
        '200':
          description: 原文和归档元数据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Source' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/index:
    get:
      operationId: getIndex
      summary: 读取当前页面索引
      responses:
        '200':
          description: 单次提交中的页面摘要列表
          content:
            application/json:
              schema:
                type: object
                required: [pages]
                properties:
                  pages:
                    type: array
                    items: { $ref: '#/components/schemas/PageSummary' }
  /v1/pages/{pageId}:
    parameters:
      - name: pageId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/PageId' }
    get:
      operationId: getPage
      summary: 读取知识页及其引用
      responses:
        '200': { $ref: '#/components/responses/Page' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: saveNote
      summary: 创建或完整替换沉淀页
      description: 创建时提供 If-None-Match，更新时提供 If-Match。每次请求提供其中一项。
      parameters:
        - name: If-None-Match
          in: header
          description: 创建页面时使用
          schema: { type: string, const: '*' }
        - name: If-Match
          in: header
          description: 更新页面时使用当前页面的单个强 ETag
          schema: { type: string, example: '"rev-42"' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NoteInput' }
      responses:
        '201':
          description: 创建沉淀页并更新索引和日志
          headers:
            Location:
              schema: { type: string, format: uri-reference }
              description: 新页面的读取路径
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Page' }
        '200':
          description: 已更新沉淀页、索引和日志
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Page' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '409':
          description: 目标页面由收录流程维护
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412':
          description: 页面当前状态与提交的版本条件不符
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/InvalidReference' }
        '428':
          description: 请求缺少版本条件
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/query:
    post:
      operationId: queryWiki
      summary: 查询知识库
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { $ref: '#/components/schemas/NonBlankText' }
            example:
              question: 周六工作坊几点开始，多少人时分组？
      responses:
        '200':
          description: 回答、引用和待核问题
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Answer' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/lint:
    post:
      operationId: checkWiki
      summary: 检查知识库并记录检查结果
      responses:
        '200':
          description: 问题清单，全部通过时返回空数组
          content:
            application/json:
              schema:
                type: object
                required: [findings]
                properties:
                  findings:
                    type: array
                    items: { $ref: '#/components/schemas/Finding' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  headers:
    PageVersion:
      description: 页面当前版本的强 ETag
      schema: { type: string, example: '"rev-42"' }
  responses:
    Page:
      description: 页面详情
      headers:
        ETag: { $ref: '#/components/headers/PageVersion' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Page' }
    InvalidRequest:
      description: 请求格式、字段或版本条件无效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidReference:
      description: 引用的页面、来源或原文行号无效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: 知识库暂时无法处理请求
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    NonBlankText:
      type: string
      pattern: '\S'
    SourceId:
      type: string
      pattern: '^src-[a-z0-9]+$'
      example: src-a123
    PageId:
      type: string
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      maxLength: 80
      example: weekend-workshop
    SourceInput:
      type: object
      required: [title, markdown]
      properties:
        title: { $ref: '#/components/schemas/NonBlankText' }
        markdown: { $ref: '#/components/schemas/NonBlankText' }
        originUrl: { type: string, format: uri, pattern: '^https?://' }
        supersedesSourceId: { $ref: '#/components/schemas/SourceId' }
    Source:
      allOf:
        - $ref: '#/components/schemas/SourceInput'
        - type: object
          required: [sourceId, ingestedAt]
          properties:
            sourceId: { $ref: '#/components/schemas/SourceId' }
            ingestedAt: { type: string, format: date-time }
    IngestResult:
      type: object
      required: [sourceId, updatedPageIds]
      properties:
        sourceId: { $ref: '#/components/schemas/SourceId' }
        updatedPageIds:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/PageId' }
    PageSummary:
      type: object
      required: [pageId, kind, title, summary]
      properties:
        pageId: { $ref: '#/components/schemas/PageId' }
        kind: { type: string, enum: [source, topic, note] }
        title: { $ref: '#/components/schemas/NonBlankText' }
        summary: { $ref: '#/components/schemas/NonBlankText' }
    Page:
      allOf:
        - $ref: '#/components/schemas/PageSummary'
        - type: object
          required: [markdown, citations]
          properties:
            markdown: { $ref: '#/components/schemas/NonBlankText' }
            citations:
              type: array
              items: { $ref: '#/components/schemas/Citation' }
    NoteInput:
      type: object
      required: [title, summary, markdown, citations]
      properties:
        title: { $ref: '#/components/schemas/NonBlankText' }
        summary: { $ref: '#/components/schemas/NonBlankText' }
        markdown: { $ref: '#/components/schemas/NonBlankText' }
        citations:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Citation' }
    Citation:
      type: object
      required: [sourceId, startLine]
      properties:
        sourceId: { $ref: '#/components/schemas/SourceId' }
        startLine: { type: integer, minimum: 1 }
        endLine:
          type: integer
          minimum: 1
          description: 闭区间末行，需大于等于起始行。省略时引用单行。
        pageId: { $ref: '#/components/schemas/PageId' }
    Answer:
      type: object
      required: [status, markdown, citations, openQuestions]
      properties:
        status: { type: string, enum: [answered, insufficient_evidence] }
        markdown: { $ref: '#/components/schemas/NonBlankText' }
        citations:
          type: array
          description: 正文标记 [^1] 对应第一项，依此类推
          items: { $ref: '#/components/schemas/Citation' }
        openQuestions:
          type: array
          items: { $ref: '#/components/schemas/NonBlankText' }
      oneOf:
        - properties:
            status: { const: answered }
            citations: { minItems: 1 }
        - properties:
            status: { const: insufficient_evidence }
            openQuestions: { minItems: 1 }
    Finding:
      type: object
      required: [kind, pageIds, message]
      properties:
        kind:
          type: string
          enum: [broken_link, missing_citation, orphan_page, stale_claim, conflicting_claim]
        pageIds:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PageId' }
        message: { $ref: '#/components/schemas/NonBlankText' }
        citations:
          type: array
          description: 问题涉及的原文证据（如有）
          items: { $ref: '#/components/schemas/Citation' }
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [invalid_request, invalid_reference, not_found, managed_page, precondition_failed, precondition_required, unavailable]
        message: { $ref: '#/components/schemas/NonBlankText' }
